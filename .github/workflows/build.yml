name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for the release step below (gh release create)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2026-11: android-actions/setup-android@v3 now fails on the hosted runner image
      # ("Failed to find package 'tools'", sdkmanager exit 1). The ubuntu runner already ships
      # the Android SDK (ANDROID_HOME); we only need the licences accepted so Gradle can fetch
      # the compileSdk platform if it is missing.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort | tail -1)
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 2026-08-07: without this the runner has no debug.keystore, so Gradle invents a NEW
      # random signing key every build. v1.4/v1.5/v1.6 each shipped a different certificate,
      # so Android refused every update ("App not installed") and the in-app updater looped
      # forever. One fixed key now comes from the ANDROID_KEYSTORE_B64 secret.
      # The file is written outside the workspace so it can never be picked up by the APK
      # build or uploaded as an artifact (this repo is public).
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing — refusing to build an APK"
            echo "that would be signed with a throwaway key and could never install as an update."
            exit 1
          fi
          mkdir -p "$HOME/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/signing/apsconnect.p12"
          echo "ANDROID_KEYSTORE_PATH=$HOME/signing/apsconnect.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      # Fail loudly if the APK did not come out signed with the shared key -- a silently
      # wrong-signed release is exactly the bug this whole change exists to prevent.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          EXPECTED=a90e23a46af9163259e3aa6b5e1a76e3fb1de94d8d1a60624d87869dbd11acbc
          if ! grep -qi "$EXPECTED" /tmp/certs.txt; then
            echo "::error::APK is signed with the WRONG key. Expected cert SHA-256 $EXPECTED"
            exit 1
          fi
          echo "signature OK — matches the shared key"

      - name: Verify APK version
        id: apk_version
        run: |
          export AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const gradle = fs.readFileSync('app/build.gradle.kts', 'utf8');
          const names = [...gradle.matchAll(/^\s*versionName\s*=\s*"([A-Za-z0-9][A-Za-z0-9._-]*)"\s*$/gm)];
          const codes = [...gradle.matchAll(/^\s*versionCode\s*=\s*([1-9][0-9]*)\s*$/gm)];
          if (names.length !== 1 || codes.length !== 1) {
            throw new Error('Expected one literal versionName and versionCode in app/build.gradle.kts');
          }
          const name = names[0][1], code = codes[0][1];
          const badging = execFileSync(process.env.AAPT, [
            'dump', 'badging', 'app/build/outputs/apk/debug/app-debug.apk'
          ], { encoding: 'utf8' });
          const pkg = badging.match(/^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'/m);
          if (!pkg || pkg[1] !== 'com.apsconnect.autodial' || pkg[2] !== code || pkg[3] !== name) {
            throw new Error('APK package/version does not match the declared APS Connect app version');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\ncode=${code}\n`);
          console.log(`Verified APS Connect APK ${name} (${code})`);
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aps-auto-dial-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload emulator regression tests
        uses: actions/upload-artifact@v4
        with:
          name: aps-auto-dial-instrumentation-debug
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      # Publish the signed APK first using its verified Gradle version. Advance version.json
      # only AFTER that release asset is verified, so phones never receive an updater URL
      # before the APK exists. Existing release tags remain immutable and reruns are safe.
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apk_version.outputs.name }}
        run: |
          TAG="v${VERSION_NAME}-debug"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION_NAME} debug build" \
              --notes "Automated build from commit ${{ github.sha }}."
          fi
